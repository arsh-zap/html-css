<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/basics.css">

    <style>
        h2 {
            color: blue;
        }

        /* class selector */
        
        span {

            color: white;
        }

        /* Group Selector */
        
        p,
        span{

            background-color: aliceblue;
        }



    </style>
</head>
<body>
    <!-- Inline CSS -->
     <h1 style="color: blue;">Hello World</h1>

     <!-- Internal CSS -->
      <h2>CSS is applied as internal</h2>

      <!-- External CSS -->
      <h3>CSS is applied as external</h3>

      <p>hello</p>
      <span>hello 2</span>
</body>
</html>
